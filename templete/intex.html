<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_title }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f1ea;
            --panel: rgba(255, 255, 255, 0.94);
            --panel-dark: #171716;
            --text: #1f1f1d;
            --muted: #77746d;
            --accent: #7a4f2a;
            --accent-dark: #5d3b20;
            --bubble: #eee7dc;
            --border: rgba(31, 31, 29, 0.10);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100dvh;
            overflow: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 15%, rgba(122, 79, 42, 0.15), transparent 28%),
                radial-gradient(circle at 90% 85%, rgba(184, 145, 99, 0.18), transparent 30%),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: min(1050px, 100%);
            height: min(850px, calc(100dvh - 40px));
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(53, 40, 25, 0.16);
            backdrop-filter: blur(14px);
        }

        .header {
            flex: 0 0 auto;
            min-height: 94px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .logo {
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            border-radius: 17px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(145deg, var(--accent), #a5764a);
            box-shadow: 0 10px 22px rgba(122, 79, 42, 0.25);
            font-size: 25px;
        }

        .title-wrap {
            min-width: 0;
        }

        .title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(20px, 3vw, 28px);
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            padding: 9px 12px;
            border-radius: 999px;
            background: #f3efe8;
            color: #5d584f;
            font-size: 12px;
            font-weight: 700;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4d8a5b;
            box-shadow: 0 0 0 4px rgba(77, 138, 91, 0.10);
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 28px clamp(16px, 5vw, 58px);
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #d1c8bb;
            border-radius: 99px;
        }

        .welcome {
            max-width: 650px;
            margin: 4vh auto 0;
            text-align: center;
        }

        .welcome-book {
            font-size: 46px;
            margin-bottom: 10px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(25px, 4vw, 38px);
        }

        .welcome p {
            margin: 0 auto 22px;
            color: var(--muted);
            line-height: 1.6;
            max-width: 580px;
        }

        .chips {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 9px;
        }

        .chip {
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 999px;
            padding: 10px 14px;
            color: #5d5146;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease;
            font: inherit;
            font-size: 13px;
        }

        .chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(53, 40, 25, .08);
        }

        .message-row {
            display: flex;
            width: 100%;
            margin: 0 0 18px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(78%, 720px);
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.55;
            font-size: 15px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .assistant .bubble {
            border: 1px solid var(--border);
            background: var(--bubble);
            border-top-left-radius: 6px;
        }

        .user .bubble {
            color: #fff;
            background: var(--accent);
            border-top-right-radius: 6px;
        }

        .meta {
            margin: 0 4px 6px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .composer {
            flex: 0 0 auto;
            padding: 14px 20px 20px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,.96);
        }

        .input-shell {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            padding: 8px 8px 8px 16px;
            border: 1px solid #dcd4c8;
            border-radius: 20px;
            background: #faf8f4;
            box-shadow: 0 8px 25px rgba(50, 38, 25, .05);
        }

        textarea {
            width: 100%;
            min-width: 0;
            min-height: 42px;
            max-height: 140px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            line-height: 1.45;
            padding: 8px 0;
        }

        textarea::placeholder {
            color: #999188;
        }

        #send {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border: 0;
            border-radius: 14px;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            font-size: 19px;
            transition: transform .18s ease, background .18s ease, opacity .18s ease;
        }

        #send:hover:not(:disabled) {
            transform: translateY(-2px);
            background: var(--accent-dark);
        }

        #send:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .hint {
            margin: 8px 4px 0;
            color: #9a9389;
            font-size: 11px;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8b7a68;
            animation: bounce 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: .12s; }
        .typing span:nth-child(3) { animation-delay: .24s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: .5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        @media (max-width: 650px) {
            body {
                padding: 0;
            }

            .app {
                width: 100%;
                height: 100dvh;
                border: 0;
                border-radius: 0;
            }

            .header {
                min-height: 78px;
                padding: 13px 15px;
            }

            .logo {
                width: 44px;
                height: 44px;
                flex-basis: 44px;
                border-radius: 14px;
            }

            .subtitle {
                font-size: 11px;
            }

            .status {
                padding: 7px 9px;
                font-size: 10px;
            }

            .messages {
                padding: 22px 13px;
            }

            .bubble {
                max-width: 88%;
                font-size: 14px;
            }

            .composer {
                padding: 10px 11px 13px;
            }

            .hint {
                display: none;
            }

            .welcome {
                margin-top: 8vh;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="brand">
                <div class="logo" aria-hidden="true">📚</div>
                <div class="title-wrap">
                    <h1 class="title">{{ chatbot_title }}</h1>
                    <p class="subtitle">Books, reading &amp; study guidance</p>
                </div>
            </div>
            <div class="status"><span class="dot"></span> Online</div>
        </header>

        <section id="messages" class="messages" aria-live="polite">
            <div id="welcome" class="welcome">
                <div class="welcome-book">📖</div>
                <h2>What would you like to explore?</h2>
                <p>
                    Ask about books, authors, genres, study books, editions,
                    reading choices, or other topics directly connected to the book store.
                </p>
                <div class="chips">
                    <button class="chip" type="button">Suggest a study book</button>
                    <button class="chip" type="button">Explain book genres</button>
                    <button class="chip" type="button">How do I choose a book?</button>
                </div>
            </div>
        </section>

        <form id="composer" class="composer">
            <div class="input-shell">
                <textarea id="message" rows="1" placeholder="Ask a book-store question..." aria-label="Message"></textarea>
                <button id="send" type="submit" aria-label="Send message">➤</button>
            </div>
            <div class="hint">Enter to send · Shift + Enter for a new line</div>
        </form>
    </main>

    <script>
        const messages = document.getElementById("messages");
        const composer = document.getElementById("composer");
        const textarea = document.getElementById("message");
        const sendButton = document.getElementById("send");
        const welcome = document.getElementById("welcome");

        function scrollToLatest() {
            requestAnimationFrame(() => {
                messages.scrollTop = messages.scrollHeight;
            });
        }

        function addMessage(text, role) {
            if (welcome) welcome.remove();

            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const wrapper = document.createElement("div");

            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = role === "user" ? "You" : "{{ chatbot_title }}";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            wrapper.appendChild(meta);
            wrapper.appendChild(bubble);
            row.appendChild(wrapper);
            messages.appendChild(row);

            scrollToLatest();
            return row;
        }

        function addTyping() {
            if (welcome) welcome.remove();

            const row = document.createElement("div");
            row.className = "message-row assistant";
            row.id = "typing-row";

            const wrapper = document.createElement("div");
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = "{{ chatbot_title }}";

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            const typing = document.createElement("div");
            typing.className = "typing";
            typing.innerHTML = "<span></span><span></span><span></span>";

            bubble.appendChild(typing);
            wrapper.appendChild(meta);
            wrapper.appendChild(bubble);
            row.appendChild(wrapper);
            messages.appendChild(row);

            scrollToLatest();
        }

        function removeTyping() {
            document.getElementById("typing-row")?.remove();
        }

        function resizeTextarea() {
            textarea.style.height = "auto";
            textarea.style.height = Math.min(textarea.scrollHeight, 140) + "px";
        }

        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text || sendButton.disabled) return;

            addMessage(text, "user");
            textarea.value = "";
            resizeTextarea();

            sendButton.disabled = true;
            textarea.disabled = true;
            addTyping();

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                removeTyping();

                if (!response.ok) {
                    addMessage(data.error || "Something went wrong. Please try again.", "assistant");
                } else {
                    addMessage(data.response || "I did not receive a response.", "assistant");
                }
            } catch (error) {
                removeTyping();
                addMessage("Unable to connect to the chatbot right now. Please try again.", "assistant");
            } finally {
                sendButton.disabled = false;
                textarea.disabled = false;
                textarea.focus();
                scrollToLatest();
            }
        }

        composer.addEventListener("submit", (event) => {
            event.preventDefault();
            sendMessage();
        });

        textarea.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        textarea.addEventListener("input", resizeTextarea);

        document.querySelectorAll(".chip").forEach((chip) => {
            chip.addEventListener("click", () => {
                textarea.value = chip.textContent;
                resizeTextarea();
                textarea.focus();
            });
        });

        resizeTextarea();
    </script>
</body>
</html>
